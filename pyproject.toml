[project]
name = "shoes-apparel-demo"
version = "0.1.0"
description = "Database course demo: FastAPI and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
